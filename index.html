<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet"  href="stylesheet.css">
  
  <title>Frontend Mentor | Product preview card component</title>

 
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="maincontainer">

    <div class="imagectn">

      <img src="image-product-desktop.jpg" alt="image-product-desktop">
      

    </div>

    <div class="contentctn">

    <div class="header1ctn">

      Perfume

    </div>

    <div class="header2ctn">

      Gabrielle Essence Eau De Parfum

    </div>

    <div class="paragraphctn">

      A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.
    

    </div>
  
    <div class="pricingctn">

      $149.99
      $169.99
    
    </div>

    <button>Add to Cart</button>
  </div>

  </div>
  

  

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/KagisoRamothwala1/RichfieldConnect">Kagiso Ramothwala</a>.
  </footer>
</body>
</html>
